name: Deploy all tool UIs to GitHub Pages

# Hosts the static UIs at the site root (https://quocchungthan.github.io/):
#   /                                  landing page
#   /para-bridge/                      Bridge            (public repo quocchungthan/PARA-AI-solution)
#   /tools-w-productioncore-aids/      Production Core Aids (private repo)
#   /tools-s-exploring-local/          Local café explorer  (private repo)
#   /tools-w-disklens/                 DiskLens             (private repo)
# Needs TOOLS_TOKEN with Contents:read on all source repos above.

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [tool-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages # TOOLS_TOKEN is an environment secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: quocchungthan/PARA-AI-solution
          token: ${{ secrets.TOOLS_TOKEN }}
          path: src/bridge
      - uses: actions/checkout@v4
        with:
          repository: quocchungthan/tools-w-productioncore-aids
          token: ${{ secrets.TOOLS_TOKEN }}
          path: src/aids
      - uses: actions/checkout@v4
        with:
          repository: quocchungthan/tools-s-exploring-local
          token: ${{ secrets.TOOLS_TOKEN }}
          path: src/exploring
      - uses: actions/checkout@v4
        with:
          repository: quocchungthan/tools-w-disklens
          token: ${{ secrets.TOOLS_TOKEN }}
          path: src/disklens
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build all UIs
        run: |
          set -e
          build() { (cd "$1" && npm ci && npm run build); }
          build src/bridge/web
          build src/aids/web
          build src/exploring/web
          (cd src/disklens/client && npm ci && npm run build:pages)
          mkdir -p site/para-bridge site/tools-w-productioncore-aids site/tools-s-exploring-local site/tools-w-disklens
          cp -r landing/. site/
          cp -r src/bridge/web/dist/. site/para-bridge/
          cp -r src/aids/web/dist/. site/tools-w-productioncore-aids/
          cp -r src/exploring/web/dist/. site/tools-s-exploring-local/
          cp -r src/disklens/client/dist/. site/tools-w-disklens/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
