name: Deploy all tool UIs to GitHub Pages

# Hosts the static UIs at the site root (https://quocchungthan.github.io/):
#   /                                  landing page
#   /para-bridge/                      Bridge            (public repo quocchungthan/PARA-AI-solution)
#   /tools-w-productioncore-aids/      Production Core Aids (private repo)
#   /tools-s-exploring-local/          Local café explorer  (private repo)
#   /tools-w-disklens/                 DiskLens             (private repo)
# TOOLS_TOKEN needs Contents:read on Bridge/EMFc and Actions:read on EMFc.

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [tool-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages # TOOLS_TOKEN is an environment secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: quocchungthan/PARA-AI-solution
          token: ${{ secrets.TOOLS_TOKEN }}
          path: src/bridge
      - uses: actions/checkout@v4
        with:
          repository: quocchungthan/EMFc-experiments
          token: ${{ secrets.TOOLS_TOKEN }}
          ref: ${{ vars.SINGLE_UI_REVISION }}
          path: src/single-ui
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Import pinned SingleUI bundles and build Bridge
        env:
          GH_TOKEN: ${{ secrets.TOOLS_TOKEN }}
          SINGLE_UI_RUN_ID: ${{ vars.SINGLE_UI_RUN_ID }}
          SINGLE_UI_REVISION: ${{ vars.SINGLE_UI_REVISION }}
        run: |
          set -euo pipefail
          [[ "$SINGLE_UI_REVISION" =~ ^[a-f0-9]{40}$ ]] || { echo "::error::Set SINGLE_UI_REVISION to the artifact source SHA"; exit 1; }
          build() { (cd "$1" && npm ci && npm run build); }
          build src/bridge/web
          mkdir -p site/para-bridge
          cp -r landing/. site/
          cp -r src/bridge/web/dist/. site/para-bridge/
          importer=src/single-ui/SingleUI/deployment/artifacts/import-app.mjs
          node "$importer" productioncore-aids site/tools-w-productioncore-aids
          node "$importer" exploring-local site/tools-s-exploring-local
          node "$importer" disklens site/tools-w-disklens
          touch site/.nojekyll
          echo "SingleUI run $SINGLE_UI_RUN_ID ($SINGLE_UI_REVISION); existing tool paths retained; no CarResearch bundle." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
